version: "3.9"

services:
  sunie-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sunie-server
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development

  sunie-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sunie-client
    ports:
      - "8501:8501"
    depends_on:
      - sunie-server
